name: Eval

# Streams real Japanese audio at the Live API. Kept off the push path because it
# runs in real time and costs quota — but run nightly, because the failure it
# catches is a config that only breaks against the live service.
on:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST
  workflow_dispatch:

jobs:
  eval:
    # macOS for `say` and `afconvert`, which generate the Japanese fixture audio.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      KATARIBE_GEMINI_API_KEY: ${{ secrets.KATARIBE_GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
        working-directory: backend

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - run: make eval-api
      - run: make eval-browser
      # Six minutes of real conversation. Too slow for the on-demand run, but
      # the only thing that covers the session length the product needs.
      - run: pnpm test:endurance
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
